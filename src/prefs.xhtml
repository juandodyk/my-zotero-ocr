<vbox>
	<groupbox>
		<label><html:h2>Lossless OCR</html:h2></label>
		<label value="Full path to ocrmypdf (leave empty to search common locations)"/>
		<html:input id="lossless-ocr-for-zotero-path" type="text"
			preference="extensions.zotero.ocrmypdf.path" style="width: 100%;"/>
		<hbox align="center">
			<label value="OCR language(s), for example eng or eng+fra+deu"/>
			<html:input id="lossless-ocr-for-zotero-language" type="text"
				preference="extensions.zotero.ocrmypdf.language" style="width: 10em;"/>
		</hbox>
		<hbox align="center">
			<label value="OCR text-layer renderer"/>
			<menulist id="lossless-ocr-for-zotero-pdf-renderer"
				preference="extensions.zotero.ocrmypdf.pdfRenderer">
				<menupopup>
					<menuitem label="fpdf2 (recommended; multilingual and RTL)" value="fpdf2"/>
					<menuitem label="sandwich (often tighter Latin-text selection)" value="sandwich"/>
					<menuitem label="word boxes (experimental; tightest selection)" value="word-box"/>
				</menupopup>
			</menulist>
		</hbox>
		<checkbox id="lossless-ocr-for-zotero-keep-backup"
			preference="extensions.zotero.ocrmypdf.keepBackup"
			label="Keep the pre-OCR PDF as a sibling attachment"/>
		<description>
			Each run removes removable invisible text, including prior OCRmyPDF layers, then
			creates one new layer with the selected renderer. PDF output and lossless
			preservation settings remain fixed.
		</description>
	</groupbox>
</vbox>
